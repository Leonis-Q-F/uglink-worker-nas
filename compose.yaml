name: uglink

services:
  console:
    image: ${UGLINK_IMAGE:-ghcr.io/leonis-q-f/uglink-worker-nas:latest}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${UGLINK_BIND_ADDRESS:-0.0.0.0}:${UGLINK_CONSOLE_PORT:-5173}:8787"
    volumes:
      - uglink-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  uglink-data:
    name: uglink-data
