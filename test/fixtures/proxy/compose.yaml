# Isolated local acceptance fixture; documentation-range subnet is intentional.
services:
  console:
    image: uglink-proxy-qa:local
    init: true
    environment:
      UGLINK_ALLOWED_ORIGINS: 'http://127.0.0.1:15173,https://proxy.test:15443,https://relay.test:15444'
      UGLINK_TRUSTED_PROXY_CIDRS: '192.0.2.10/32'
      UGLINK_PROXY_HEADER_MODE: x-forwarded-single
      UGLINK_HOST_ORIGIN_MAP: '{"relay.test:15444":"https://relay.test:15444"}'
    ports: ['127.0.0.1:15173:8787']
    volumes: ['qa-data:/data']
    read_only: true
    tmpfs: ['/tmp']
    networks:
      default:
        ipv4_address: 192.0.2.20
  proxy:
    image: node:22.23.3-bookworm-slim
    command: ['node', '/qa/proxy.mjs']
    volumes:
      - ./proxy.mjs:/qa/proxy.mjs:ro
      - ../../../test-results/proxy-certs:/certs:ro
    ports: ['127.0.0.1:15443:443', '127.0.0.1:15444:444']
    networks:
      default:
        ipv4_address: 192.0.2.10
volumes:
  qa-data:
networks:
  default:
    ipam:
      config:
        - subnet: 192.0.2.0/24
